<!DOCTYPE html>

<head>

<body>
<div class="stage">
 <div class="panel">
  <div class="circle"></div>
  <div class="in">
   <div class="top">
    <div class="logo" id="logo"></div>
    <nav class="nav" id="nav" aria-label="Kategori"></nav>
    <label class="search"><input id="q" type="search" placeholder="Cari" aria-label="Cari aplikasi" autocomplete="off"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></label>
    <div class="basket"><i class="rd"></i><span>Aplikasi (<b id="n">0</b>)</span><div class="burger" aria-hidden="true"><i></i><i></i><i></i></div></div>
   </div>
   <div class="hero">
    <div class="tag"><div class="ti" id="tg"></div><a href="#deck">Lihat semua</a></div>
    <div class="hr">
     <h1 id="h"><span>Semua aplikasi,</span><span>satu halte.</span></h1>
     <p>Pilih tujuanmu, ketuk, langsung berangkat. Semua web app buatanmu terkumpul di satu tempat.</p>
     <div class="cta"><a id="go" href="#" target="_blank" rel="noopener">Buka yang terpilih</a></div>
    </div>
   </div>
   <div class="deck" id="deck"></div>
   <p class="empty" id="empty" hidden>Tidak ada aplikasi yang cocok. Coba kata kunci lain.</p>
  </div>
 </div>
</div>
